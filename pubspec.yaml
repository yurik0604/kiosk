name: kiosk
description: "RFID self-checkout kiosk."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Routing
  go_router: ^15.0.0

  # Local NoSQL DB
  objectbox: ^4.3.0
  objectbox_flutter_libs: ^4.3.0

  # Kiosk system
  wakelock_plus: ^1.3.2

  # UI
  google_fonts: ^6.3.2

  # Networking
  http: ^1.5.0

  # Secure storage (auth tokens)
  flutter_secure_storage: ^9.2.4

  # Environment configuration
  flutter_dotenv: ^5.2.1

  # Logging
  logger: ^2.4.0

  # Utils
  path_provider: ^2.1.5
  intl: ^0.20.2
  connectivity_plus: ^7.3.1

  # RFID EPC decoding (AES-256 ECB for XCode 128-bit tags)
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  objectbox_generator: ^4.3.0

dependency_overrides:
  analyzer: 8.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - .env.local
    - .env.prod
